<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — Prado Moncherri</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Tela de login -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>Painel Prado Moncherri</h1>
    <p>Acesso restrito — entre com o e-mail e senha cadastrados.</p>
    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
    <p class="error-text" id="loginError"></p>
  </form>
</div>

<!-- App (depois de logar) -->
<div class="hidden" id="appScreen">
  <header class="app-header">
    <h1>Painel Prado Moncherri</h1>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="who" id="whoAmI"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Sair</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="produtos">Produtos</button>
    <button class="tab-btn" data-tab="pedidos">Pedidos</button>
  </nav>

  <section class="tab-panel" id="panelProdutos">
    <div class="table-scroll">
      <table class="products-table">
        <thead>
          <tr>
            <th class="col-name">Nome</th>
            <th>Categoria</th>
            <th class="col-desc">Descrição</th>
            <th class="col-image">Foto (URL)</th>
            <th>Preço (R$)</th>
            <th>Estoque</th>
            <th>Disponível</th>
            <th>Destaque</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="tab-panel hidden" id="panelPedidos">
    <div class="orders-list" id="ordersList"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
